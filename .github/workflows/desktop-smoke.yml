name: Desktop worker smoke tests
on:
  pull_request:
  push:
    branches:
      - feature/offline-desktop-foundation
jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency-free desktop worker tests
        run: python -m unittest discover -s tests -p test_desktop_worker.py -v
      - name: Syntax check
        run: python -m py_compile pocket_tts/desktop/worker.py tests/test_desktop_worker.py
